name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Publish dist into docs/ (for Pages: branch main / docs)
        run: |
          test -f dist/index.html
          grep -q '/kid-history-1/assets/' dist/index.html
          test -f dist/data/events.json
          rm -rf docs
          mkdir docs
          cp -R dist/. docs/
          touch docs/.nojekyll

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "Deploy site to docs/ for GitHub Pages"
          git push
