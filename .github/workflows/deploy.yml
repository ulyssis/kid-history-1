name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          # Ensure Vite uses the GitHub Pages base path
          GITHUB_ACTIONS: true
      - name: Verify dist looks like a Vite build
        run: |
          test -f dist/index.html
          grep -q '/kid-history-1/assets/' dist/index.html
          test -f dist/data/events.json
          test -f dist/data/territories/manifest.json
          echo "dist OK:"
          head -20 dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
